services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=on", "-c", "log_min_duration_statement=${POSTGRES_SLOW_QUERY_MS:-250}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketrush}
      POSTGRES_USER: ${POSTGRES_USER:-ticketrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-observability.sql:/docker-entrypoint-initdb.d/observability.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --appendfsync everysec --maxmemory-policy noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ticketrush}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.26
    ports:
      - "127.0.0.1:${MAIL_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ${BACKEND_IMAGE:-ticketrush-week7-backend}
    build: ./backend
    environment:
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-10}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
      SPRING_THREADS_VIRTUAL_ENABLED: ${VIRTUAL_THREADS_ENABLED:-false}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx768m}
      RESERVATION_STRATEGY: ${RESERVATION_STRATEGY:-conditional-update}
      REDIS_ENV: ${REDIS_ENV:-dev}
      REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-300ms}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-300ms}
      REDIS_CIRCUIT_COOLDOWN: ${REDIS_CIRCUIT_COOLDOWN:-5s}
      REDIS_ATTEMPT_LEASE: ${REDIS_ATTEMPT_LEASE:-1m}
      REDIS_FALLBACK_ENABLED: ${REDIS_FALLBACK_ENABLED:-true}
      REDIS_RECONCILE_INTERVAL: ${REDIS_RECONCILE_INTERVAL:-30s}
      WAITING_ROOM_DEFAULT: ${WAITING_ROOM_DEFAULT:-false}
      WAITING_ROOM_MODE: ${WAITING_ROOM_MODE:-fifo}
      WAITING_ROOM_RATE: ${WAITING_ROOM_RATE:-10}
      WAITING_ROOM_INTERVAL: ${WAITING_ROOM_INTERVAL:-1s}
      WAITING_ROOM_HEARTBEAT_TTL: ${WAITING_ROOM_HEARTBEAT_TTL:-30s}
      WAITING_ROOM_TOKEN_TTL: ${WAITING_ROOM_TOKEN_TTL:-10m}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?Set PAYMENT_WEBHOOK_SECRET in .env}
      PAYMENT_WEBHOOK_URL: http://127.0.0.1:8080/api/v1/payments/webhook
      MOCK_PAYMENT_DELAY: ${MOCK_PAYMENT_DELAY:-500ms}
      MOCK_PAYMENT_DELAYED_SUCCESS: ${MOCK_PAYMENT_DELAYED_SUCCESS:-11m}
      MOCK_PAYMENT_DUPLICATE_COUNT: ${MOCK_PAYMENT_DUPLICATE_COUNT:-20}
      PAYMENT_TIMESTAMP_TOLERANCE: ${PAYMENT_TIMESTAMP_TOLERANCE:-5m}
      PAYMENT_LATE_GRACE: ${PAYMENT_LATE_GRACE:-5m}
      MOCK_PAYMENT_SCENARIOS_ENABLED: ${MOCK_PAYMENT_SCENARIOS_ENABLED:-false}
      MOCK_PAYMENT_TEST_TOKEN: ${MOCK_PAYMENT_TEST_TOKEN:-}
      RESERVATION_HOLD_DURATION: ${RESERVATION_HOLD_DURATION:-10m}
      RESERVATION_JOB_INTERVAL: ${RESERVATION_JOB_INTERVAL:-30s}
      RESERVATION_BATCH_SIZE: ${RESERVATION_BATCH_SIZE:-100}
      RESERVATION_OPTIMISTIC_ATTEMPTS: ${RESERVATION_OPTIMISTIC_ATTEMPTS:-20}
      RESERVATION_EXPIRY_ENABLED: ${RESERVATION_EXPIRY_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-true}
      DEV_SEED_EVENTS: ${DEV_SEED_EVENTS:-50}
      DEV_SEED_TIERS_PER_EVENT: ${DEV_SEED_TIERS_PER_EVENT:-3}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ticketrush}
      POSTGRES_USER: ${POSTGRES_USER:-ticketrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-ticketrush}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 15

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    environment:
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}
    entrypoint: [/bin/sh, -ec]
    command:
      - 'umask 077; printf "%s" "$$METRICS_PASSWORD" > /tmp/metrics-password; exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d --web.enable-remote-write-receiver'
    volumes:
      - ./infrastructure/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [observability]
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-ticketrush}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-ticketrush}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/exporter/queries.yml
    volumes: ["./infrastructure/postgres/queries.yml:/etc/exporter/queries.yml:ro"]

  redis-exporter:
    image: oliver006/redis_exporter:v1.77.0
    profiles: [observability]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}

  cadvisor:
    image: ghcr.io/google/cadvisor:0.54.0
    profiles: [observability]
    privileged: true
    command: ["--docker_only=true", "--housekeeping_interval=10s", "--enable_metrics=cpu,memory,network,process"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

volumes:
  prometheus_data:
  grafana_data:
  redis_data:
  postgres_data:
  rabbitmq_data:
