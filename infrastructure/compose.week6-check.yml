# Use only with a dedicated project name; keeps development ports and volumes separate.
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  rabbitmq:
    ports: !reset []
  mailpit:
    ports: !reset []
  backend:
    ports: !override
      - "127.0.0.1:28086:8080"
    environment:
      DEV_SEED_ENABLED: "false"
      RESERVATION_STRATEGY: redis-gate
      REDIS_CIRCUIT_COOLDOWN: 1s
      REDIS_RECONCILE_INTERVAL: 5s
