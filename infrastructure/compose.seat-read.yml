# Isolated M2 read-path measurement. Use project ticketrush-m2-read and a private env file.
services:
  postgres:
    ports: !override []
    deploy: {resources: {limits: {cpus: "2.0", memory: 1G}}}
  redis:
    ports: !override []
    deploy: {resources: {limits: {cpus: "1.0", memory: 256M}}}
  rabbitmq:
    ports: !override []
    deploy: {resources: {limits: {cpus: "1.0", memory: 512M}}}
  mailpit:
    ports: !override []
    deploy: {resources: {limits: {cpus: "0.5", memory: 128M}}}
  backend:
    image: ticketrush-m2-read-backend
    ports: !override ["127.0.0.1:28882:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DEV_SEED_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx640m
      HIKARI_MAX_POOL_SIZE: "16"
      REDIS_ENV: m2-read
    deploy: {resources: {limits: {cpus: "2.0", memory: 1G}}}
  k6:
    image: grafana/k6:1.3.0
    user: "0:0"
    profiles: [measurement]
    volumes:
      - ./loadtest:/scripts:ro
      - ./.tmp/m2-measure:/results
    deploy: {resources: {limits: {cpus: "2.0", memory: 512M}}}
