# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free demo deployment: the frontend and API are public; data stores stay private.
services:
  - type: web
    name: ticketrush-frontend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: BACKEND_URL
        value: https://ticketrush-backend.onrender.com

  - type: web
    name: ticketrush-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod,demo
      - key: DEV_SEED_ENABLED
        value: "false"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_BROWSER_ORIGINS
        fromService:
          type: web
          name: ticketrush-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NOTIFICATION_WS_ORIGINS
        fromService:
          type: web
          name: ticketrush-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: ticketrush-postgres
          property: connectionString
      - key: POSTGRES_USER
        fromDatabase:
          name: ticketrush-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: ticketrush-postgres
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ticketrush-redis
          property: connectionString
      - key: REDIS_ENV
        value: prod
      - key: REDIS_PASSWORD
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_URL
        value: http://127.0.0.1:8080/api/v1/payments/webhook
      - key: MOCK_PAYMENT_SCENARIOS_ENABLED
        value: "false"
      - key: JAVA_TOOL_OPTIONS
        value: -Xms128m -Xmx320m

  - type: keyvalue
    name: ticketrush-redis
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

databases:
  - name: ticketrush-postgres
    region: singapore
    plan: free
    databaseName: ticketrush
    user: ticketrush
    postgresMajorVersion: "17"
    ipAllowList: []
