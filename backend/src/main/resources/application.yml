spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: ticketrush
  profiles:
    default: dev
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:1500}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketrush}
    username: ${POSTGRES_USER:ticketrush}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_COMMAND_TIMEOUT:300ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:300ms}
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:ticketrush}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_ENABLED:true}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: ${MAIL_CONNECT_TIMEOUT:2000}
      mail.smtp.timeout: ${MAIL_TIMEOUT:5000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT:5000}
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s
server:
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        lettuce.command.completion: true
        hikaricp.connections.acquire: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    tags:
      application: ticketrush
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    rabbit:
      enabled: false
app:
  cloudinary:
    url: ${CLOUDINARY_URL:}
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    jwt-secret: ${JWT_SECRET}
    issuer: ticketrush
    access-ttl: 15m
    refresh-ttl: 7d
    login-limit: 10
    login-window: 1m
springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs

ticketrush:
  rate-limit:
    trusted-proxies: ${TRUSTED_PROXIES:}
  redis:
    environment: ${REDIS_ENV:dev}
    cooldown: ${REDIS_CIRCUIT_COOLDOWN:2s}
    attempt-lease: ${REDIS_ATTEMPT_LEASE:1m}
    fallback-enabled: ${REDIS_FALLBACK_ENABLED:true}
    breaker-window-size: ${REDIS_BREAKER_WINDOW_SIZE:100}
    breaker-minimum-calls: ${REDIS_BREAKER_MINIMUM_CALLS:50}
    breaker-failure-rate-threshold: ${REDIS_BREAKER_FAILURE_RATE_THRESHOLD:0.5}
    breaker-half-open-probes: ${REDIS_BREAKER_HALF_OPEN_PROBES:3}
    breaker-mode: ${REDIS_BREAKER_MODE:count-based}
    reconcile-interval: ${REDIS_RECONCILE_INTERVAL:30s}
  queue:
    enabled-by-default: ${WAITING_ROOM_DEFAULT:false}
    mode: ${WAITING_ROOM_MODE:fifo}
    rate: ${WAITING_ROOM_RATE:20}
    interval: ${WAITING_ROOM_INTERVAL:1s}
    heartbeat-ttl: ${WAITING_ROOM_HEARTBEAT_TTL:30s}
    token-ttl: ${WAITING_ROOM_TOKEN_TTL:10m}
    status-target-requests-per-second: ${WAITING_ROOM_STATUS_TARGET_RPS:500}
    max-poll-interval-seconds: ${WAITING_ROOM_MAX_POLL_INTERVAL_SECONDS:15}
    capture-admitted: ${WAITING_ROOM_CAPTURE_ADMITTED:false}
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
    webhook-url: ${PAYMENT_WEBHOOK_URL:http://127.0.0.1:8080/api/v1/payments/webhook}
    delay: ${MOCK_PAYMENT_DELAY:500ms}
    delayed-success-delay: ${MOCK_PAYMENT_DELAYED_SUCCESS:11m}
    duplicate-count: ${MOCK_PAYMENT_DUPLICATE_COUNT:20}
    timestamp-tolerance: ${PAYMENT_TIMESTAMP_TOLERANCE:5m}
    late-grace: ${PAYMENT_LATE_GRACE:5m}
    test-scenarios-enabled: ${MOCK_PAYMENT_SCENARIOS_ENABLED:false}
    test-token: ${MOCK_PAYMENT_TEST_TOKEN:}
  reservation:
    strategy: ${RESERVATION_STRATEGY:conditional-update}
    hold-duration: ${RESERVATION_HOLD_DURATION:10m}
    job-interval: ${RESERVATION_JOB_INTERVAL:30s}
    batch-size: ${RESERVATION_BATCH_SIZE:100}
    optimistic-attempts: ${RESERVATION_OPTIMISTIC_ATTEMPTS:20}
    expiry-enabled: ${RESERVATION_EXPIRY_ENABLED:true}
  order:
    joined-status-read: ${ORDER_STATUS_JOINED_READ:true}
  bulkhead:
    enabled: ${BULKHEAD_ENABLED:true}
    max-concurrent: ${BULKHEAD_MAX_CONCURRENT:0}
    pool-multiplier: ${BULKHEAD_POOL_MULTIPLIER:3}
    # Derived capacity: admission rate x bounded request hold x safety factor.
    # At the default 20/s, 1 s and 1.5 this yields 30 permits.
    assumed-hold-seconds: ${BULKHEAD_ASSUMED_HOLD_SECONDS:1}
    safety-factor: ${BULKHEAD_SAFETY_FACTOR:1.5}
  outbox:
    relay-interval: ${OUTBOX_RELAY_INTERVAL:1s}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    initial-backoff: ${OUTBOX_INITIAL_BACKOFF:1s}
    max-backoff: ${OUTBOX_MAX_BACKOFF:5m}
    confirm-timeout: ${OUTBOX_CONFIRM_TIMEOUT:5s}
    cleanup-interval: ${OUTBOX_CLEANUP_INTERVAL:24h}
    retention-days: ${OUTBOX_RETENTION_DAYS:7}
  notification:
    max-retries: ${NOTIFICATION_MAX_RETRIES:5}
    concurrency: ${NOTIFICATION_CONCURRENCY:2}
    prefetch: ${NOTIFICATION_PREFETCH:10}
