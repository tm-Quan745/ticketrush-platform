logging:
  level:
    com.vibe.ticketrush: INFO

ticketrush:
  rate-limit:
    enabled: false
  redis:
    reconcile-interval: 1h
  queue:
    initial-delay: 1h
  reservation:
    expiry-enabled: false
  outbox:
    relay-interval: 1h
  notification:
    concurrency: 1
    prefetch: 1
spring:
  datasource:
    hikari:
      # The 200-thread PostgreSQL Testcontainers invariant suite queues behind
      # the test pool; production keeps its 1,500 ms fail-fast setting.
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:30000}
  rabbitmq:
    listener:
      simple:
        auto-startup: false
