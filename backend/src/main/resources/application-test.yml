logging:
  level:
    com.vibe.ticketrush: INFO

ticketrush:
  rate-limit:
    enabled: false
  redis:
    reconcile-interval: 1h
  queue:
    initial-delay: 1h
  reservation:
    expiry-enabled: false
  outbox:
    relay-interval: 1h
  notification:
    concurrency: 1
    prefetch: 1
spring:
  rabbitmq:
    listener:
      simple:
        auto-startup: false
